version: "2"
run:
  timeout: 5m
  modules-download-mode: readonly
linters:
  enable:
    - bodyclose
    - misspell
    - noctx
    - prealloc
    - unconvert
  settings:
    errcheck:
      check-type-assertions: true
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - bodyclose
          - errcheck
        path: _test\.go
      - linters:
          - errcheck
          - noctx
        path: scripts/
      - linters:
          - errcheck
        path: internal/testutil/
      - linters:
          - all
        path: pb/
      - linters:
          - all
        path: types\.gen\.go
      - linters:
          - errcheck
          - forbidigo
        path: examples/
      - linters:
          - misspell
        text: cancelled|Cancelled|Cancelling|cancelling
      - linters:
          - misspell
        text: marshalling
      - linters:
          - errcheck
        path: spooled/worker/
      - linters:
          - staticcheck
        text: SA1019
      - linters:
          - bodyclose
        path: spooled/realtime/
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/spooled-cloud/spooled-sdk-go
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
