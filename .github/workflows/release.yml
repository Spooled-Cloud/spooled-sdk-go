name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Verify release identity
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release tag must be strict vX.Y.Z, got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          SOURCE_VERSION="$(sed -n 's/^[[:space:]]*Version = "\([^"]*\)"/\1/p' internal/version/version.go)"
          if [ "$VERSION" != "$SOURCE_VERSION" ]; then
            echo "Tag version $VERSION does not match internal/version.Version $SOURCE_VERSION" >&2
            exit 1
          fi
          if ! grep -Eq "^## \[$VERSION\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md has no dated section for $VERSION" >&2
            exit 1
          fi
          echo "Release identity verified: $VERSION"

      - name: Run tests
        run: go test -v ./...

      - name: Extract release notes
        id: release_notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Extract the exact changelog section without treating version dots as regex wildcards.
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { flag = 1; next }
            flag && index($0, "## [") == 1 { flag = 0 }
            flag { print }
          ' CHANGELOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "Missing release notes for $VERSION" >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.release_notes.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify pkg.go.dev
        run: |
          curl -s "https://pkg.go.dev/github.com/spooled-cloud/spooled-sdk-go@v${{ steps.release_notes.outputs.version }}" > /dev/null || true
